<!-- Cookies -->
<script>
   (function() {
    function setCookie(name, value, days) {
      var expires = "";
      if (days) {
        var date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict; Secure";
    }
    function getCookie(name) {
      var nameEQ = name + "=";
      var ca = document.cookie.split(';');
      for (var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }
    document.addEventListener('DOMContentLoaded', function() {
      var cookieConsent = getCookie('cookieConsent');
      if (cookieConsent === null) {
        var banner = document.getElementById('cookie-banner');
        if (banner) banner.style.display = 'block';
      }
    });
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.cookie-btn');
      if (!btn) return;
      if (btn.classList.contains('cookie-accept')) {
        setCookie('cookieConsent', 'accepted', 365);
      } else if (btn.classList.contains('cookie-reject')) {
        setCookie('cookieConsent', 'rejected', 365);
      }
      var banner = document.getElementById('cookie-banner');
      if (banner) banner.style.display = 'none';
    });
  })();
</script>

<!-- Lazy initialization de carruseles -->
<script>
   document.addEventListener('DOMContentLoaded', function() {
    if (!('IntersectionObserver' in window)) return;
    var lazyCarousels = document.querySelectorAll('.carousel[data-bs-lazy="true"]');
    var carouselObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var carouselEl = entry.target;
           if (!carouselEl.dataset.bsInitialized) {
             carouselEl.dataset.bsInitialized = 'true';
             if (typeof bootstrap !== 'undefined' && bootstrap.Carousel) {
               new bootstrap.Carousel(carouselEl);
             }
           }
          carouselObserver.unobserve(carouselEl);
        }
      });
    }, { rootMargin: '100px' });
    lazyCarousels.forEach(function(carousel) { carouselObserver.observe(carousel); });
  });
</script>

<!-- Lazy load del video -->
<script>
   document.addEventListener('DOMContentLoaded', function() {
    var video = document.querySelector('video[data-video-poster]');
    if (!video) return;
    var videoObserver = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        video.preload = 'metadata';
        videoObserver.unobserve(video);
      }
    }, { rootMargin: '200px' });
videoObserver.observe(video);
  });
</script>
