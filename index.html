  <!-- Banner de Cookies -->
  <div id="cookie-banner" class="cookie-banner" style="display: none;">
    <div class="cookie-content">
      <p>Utilizamos cookies para mejorar tu experiencia. Al continuar, aceptas nuestro uso de cookies.</p>
      <div class="cookie-buttons">
        <button type="button" class="cookie-btn cookie-accept" onclick="acceptCookies()">Aceptar</button>
        <button type="button" class="cookie-btn cookie-reject" onclick="rejectCookies()">Rechazar</button>
      </div>
    </div>
  </div>
  <script>
    function setCookie(name, value, days) {
      var expires = "";
      if (days) {
        var date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict; Secure";
    }
    function getCookie(name) {
      var nameEQ = name + "=";
      var ca = document.cookie.split(';');
      for (var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }
    document.addEventListener('DOMContentLoaded', function() {
      var cookieConsent = getCookie('cookieConsent');
      if (cookieConsent === null) {
        document.getElementById('cookie-banner').style.display = 'block';
      }
    });
    function acceptCookies() {
      setCookie('cookieConsent', 'accepted', 365);
      document.getElementById('cookie-banner').style.display = 'none';
    }
    function rejectCookies() {
      setCookie('cookieConsent', 'rejected', 365);
      document.getElementById('cookie-banner').style.display = 'none';
    }
  </script>

 <!-- Component Factory - Carga de Componentes (defer para no bloquear) -->
      <script defer src="assets/js/component-factory.js"></script>
<script>console.log('Scripts de factory cargados');</script>
      <script>
        // Esperar DOMContentLoaded y ejecutar
      function initComponents() {
        if (typeof ComponentFactory === 'undefined') {
          if (!initComponents._intentos) initComponents._intentos = 0;
          if (initComponents._intentos++ < 10) {
            setTimeout(initComponents, 100);
            console.warn('ComponentFactory pendiente, reintento ' + initComponents._intentos);
          } else {
            console.error('ComponentFactory no disponible tras reintentos');
          }
          return;
        }
        initComponents._intentos = 0;
        console.log('Inicializando componentes via Factory...');
        ComponentFactory.loadLazy(['footer', 'contacto', 'faq', 'social-buttons', 'chat-widget']);
        ComponentFactory.load('nosotros');
        
        function cargarHorario() {
          var container = document.getElementById('horario-card-container');
          if (container && container.innerHTML.trim() === '') {
            ComponentFactory.load('horario');
          } else if (!container) {
            requestAnimationFrame(cargarHorario);
          }
        }
        
        if (!initComponents._listenerHorario) {
          initComponents._listenerHorario = true;
document.addEventListener('component:loaded', function(e) {
              if (e.detail && e.detail.id === 'nosotros-container') {
                cargarHorario();
              }
            });
        }
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initComponents);
      } else {
        initComponents();
      }
     </script>

    <!-- Cargar botón de dark mode en el header -->
    <script>
       // Esperar a que darkMode esté disponible
       function waitForDarkMode(callback) {
         if (window.darkMode || window.DarkMode) {
           callback();
         } else {
           setTimeout(() => waitForDarkMode(callback), 100);
         }
       }
      
       const loadOnIdle = (el, url) => {
         if (!el || el.dataset.loaded) return;
         el.dataset.loaded = 1;
         fetch(url)
           .then(r => r.ok ? r.text() : Promise.reject())
           .then(html => { 
             el.innerHTML = html; 
           })
           .catch(() => {});
       };
      
      // Cargar después de que la página esté lista
      window.addEventListener('load', () => {
        setTimeout(() => {
          loadOnIdle(document.getElementById('dark-mode-header'), '/components/dark-mode/dark-mode-btn.html');
        }, 500);
      });
    </script>

   <!-- Bootstrap JS eliminado (no se usa carousel en homepage) -->

    <!-- Lazy initialization de carruseles para reducir TBT -->
    <script defer>
      document.addEventListener('DOMContentLoaded', function() {
        if (!('IntersectionObserver' in window)) return;
        var lazyCarousels = document.querySelectorAll('.carousel[data-bs-lazy="true"]');
        var carouselObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var carouselEl = entry.target;
               if (!carouselEl.dataset.bsInitialized) {
                 carouselEl.dataset.bsInitialized = 'true';
                 if (typeof bootstrap !== 'undefined' && bootstrap.Carousel) {
                   new bootstrap.Carousel(carouselEl);
                 }
               }
              carouselObserver.unobserve(carouselEl);
            }
          });
        }, { rootMargin: '100px' });
        lazyCarousels.forEach(function(carousel) { carouselObserver.observe(carousel); });
      });
    </script>

    <!-- Lazy load del video para mejorar LCP -->
    <script defer>
      document.addEventListener('DOMContentLoaded', function() {
        var video = document.querySelector('video[data-video-poster]');
        if (!video) return;
        var videoObserver = new IntersectionObserver(function(entries) {
          if (entries[0].isIntersecting) {
            video.preload = 'metadata';
            videoObserver.unobserve(video);
          }
        }, { rootMargin: '200px' });
        videoObserver.observe(video);
      });
</script>
