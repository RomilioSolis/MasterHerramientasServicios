<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Simple Equipos</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #fff; padding: 20px; }
    h1 { color: #c41e3a; margin-bottom: 20px; }
    .test { background: #2d2d4a; padding: 15px; margin: 10px 0; border-radius: 5px; }
    .pass { color: #51cf66; }
    .fail { color: #ff6b6b; }
    .info { color: #74c0fc; }
  </style>
</head>
<body>
  <h1>Test de Equipos</h1>
  <div id="output"></div>

  <script>
    function test() {
      var out = document.getElementById('output');
      out.innerHTML = '';
      
      function log(msg, cls) {
        var d = document.createElement('div');
        d.className = 'test ' + (cls || '');
        d.textContent = msg;
        out.appendChild(d);
        console.log(msg);
      }
      
      log('=== TEST EQUIPOS ===', 'info');
      
      // 1. Contenedores
      var c1 = document.getElementById('herramientas-container');
      var c2 = document.getElementById('herramientas-container-2');
      log('Contenedor 1: ' + (c1 ? 'OK' : 'FALTA'), c1 ? 'pass' : 'fail');
      log('Contenedor 2: ' + (c2 ? 'OK' : 'FALTA'), c2 ? 'pass' : 'fail');
      
      if (!c1) {
        log('ERROR: herramientas-container NO existe', 'fail');
        log('Abre index.html, NO este archivo', 'info');
        return;
      }
      
      // 2. Articulos
      var a1 = c1.querySelectorAll('article');
      var a2 = c2 ? c2.querySelectorAll('article') : [];
      log('Articulos: ' + a1.length + ' + ' + a2.length, 'info');
      
      // 3. Por categoria
      var todos = [...a1, ...a2];
      var cats = {};
      todos.forEach(function(a) {
        var cat = a.getAttribute('data-category');
        var tit = a.querySelector('.card-title');
        var nombre = tit ? tit.textContent.trim() : '??';
        if (!cats[cat]) cats[cat] = [];
        cats[cat].push(nombre);
      });
      
      log('Por categoria:', 'info');
      Object.keys(cats).forEach(function(c) {
        log('  ' + c + ': ' + cats[c].join(', '), 'info');
      });
      
      // 4. Funcion
      log('showEquipmentDetail: ' + typeof window.showEquipmentDetail, 
          typeof window.showEquipmentDetail === 'function' ? 'pass' : 'fail');
      
      // 5. Test click
      log('Test click (jardin,1):', 'info');
      if (typeof window.showEquipmentDetail === 'function') {
        var e = { preventDefault: function(){}, stopPropagation: function(){} };
        window.showEquipmentDetail(e, 'jardin', 1);
        
        setTimeout(function() {
          var visibles = todos.filter(function(a) { return a.style.display === 'block'; });
          log('Visibles: ' + visibles.length, visibles.length > 0 ? 'pass' : 'fail');
          if (visibles.length === 0) {
            // Verificar con computedStyle
            var display = window.getComputedStyle(todos[0]).display;
            log('CSS display: ' + display, 'info');
          }
        }, 200);
      } else {
        log('Funcion NO existe', 'fail');
      }
      
      log('=== FIN ===', 'info');
    }
    
    // Ejecutar cuando cargue
    if (document.readyState === 'complete') {
      test();
    } else {
      window.onload = test;
    }
  </script>
</body>
</html>
