<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Debug Equipos</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #fff; padding: 20px; }
    h1 { color: #c41e3a; }
    button { padding: 15px 30px; background: #c41e3a; color: #fff; border: none; cursor: pointer; margin: 10px 10px 10px 0; font-size: 16px; }
    button:hover { background: #a01830; }
    .result { margin: 10px 0; padding: 10px; background: #2d2d4a; border-radius: 5px; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    iframe { width: 100%; height: 500px; margin-top: 20px; border: 2px solid #c41e3a; }
  </style>
</head>
<body>
  <h1>Test Debug Equipos</h1>
  <p>Este test carga index.html en un iframe y verifica si los equipos funcionan.</p>
  
  <button onclick="runTest()">EJECUTAR TEST</button>
  <p id="status">Esperando que cargue index.html...</p>
  
  <div id="results"></div>
  <iframe id="iframe" src="../index.html" onload="iframeLoaded()"></iframe>

  <script>
    var iframeReady = false;
    
    function iframeLoaded() {
      iframeReady = true;
      document.getElementById('status').textContent = 'Index.html cargado. Haz click en "EJECUTAR TEST"';
      document.getElementById('status').style.color = '#51cf66';
    }
    
    // Ejecutar automáticamente cuando la página esté lista
    window.onload = function() {
      setTimeout(runTest, 3000); // Esperar 3 segundos a que cargue
    };
    function log(msg, type) {
      const div = document.createElement('div');
      div.className = 'result ' + (type || '');
      div.textContent = msg;
      document.getElementById('results').appendChild(div);
      console.log(msg);
    }

    function loadIndex() {
      document.getElementById('iframe').src = '../index.html';
    }

    function runTest() {
      document.getElementById('results').innerHTML = '';
      const iframe = document.getElementById('iframe');
      const doc = iframe.contentDocument || iframe.contentWindow.document;

      log('=== INICIANDO TEST ===', 'success');

      // 1. Verificar contenedores
      const c1 = doc.getElementById('herramientas-container');
      const c2 = doc.getElementById('herramientas-container-2');
      log('Contenedor 1: ' + (c1 ? 'EXISTE' : 'NO EXISTE'), c1 ? 'success' : 'error');
      log('Contenedor 2: ' + (c2 ? 'EXISTE' : 'NO EXISTE'), c2 ? 'success' : 'error');

      if (!c1 || !c2) {
        log('ERROR: Contenedores NO existen en index.html', 'error');
        return;
      }

      // 2. Artículos
      const arts1 = c1.querySelectorAll('article');
      const arts2 = c2.querySelectorAll('article');
      log('Artículos container1: ' + arts1.length);
      log('Artículos container2: ' + arts2.length);
      log('Total: ' + (arts1.length + arts2.length));

      // 3. Por categoría
      const todos = [...arts1, ...arts2];
      const porCat = {};
      todos.forEach(a => {
        const cat = a.getAttribute('data-category');
        const tit = a.querySelector('.card-title')?.textContent?.trim() || 'SIN TITULO';
        if (!porCat[cat]) porCat[cat] = [];
        porCat[cat].push(tit);
      });
      log('=== EQUIPOS POR CATEGORÍA ===', 'success');
      Object.keys(porCat).forEach(cat => log('  ' + cat + ': ' + porCat[cat].join(', ')));

      // 4. Función
      const func = doc.defaultView.showEquipmentDetail;
      log('showEquipmentDetail: ' + (typeof func === 'function' ? 'EXISTE' : 'NO EXISTE'), 
          typeof func === 'function' ? 'success' : 'error');

      // 5. Test click
      log('=== TEST CLICK (jardin, 1) ===', 'success');
      if (typeof func === 'function') {
        const event = { preventDefault: function(){}, stopPropagation: function(){} };
        func(event, 'jardin', 1);

        setTimeout(function() {
          const visibles = todos.filter(function(a) { return a.style.display === 'block'; });
          log('Equipos visibles: ' + visibles.length, visibles.length > 0 ? 'success' : 'error');
          visibles.forEach(function(a) {
            const t = a.querySelector('.card-title');
            log('  -> ' + (t ? t.textContent.trim() : '???'), 'success');
          });
          if (visibles.length === 0) {
            log('ERROR: Ningún equipo visible!', 'error');
          }
        }, 300);
      } else {
        log('ERROR: Función NO existe!', 'error');
      }

      log('=== TEST COMPLETADO ===', 'success');
    }
  </script>
</body>
</html>
