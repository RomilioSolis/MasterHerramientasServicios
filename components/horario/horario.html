<div class="netflix-card floating-card" style="padding: 1rem; min-height: 300px;">
  <div class="text-center">
    <h3 class="mb-3 text-white fw-bold" style="font-size: 1.1rem;"><i class="bi bi-clock me-2"></i>Horario de Atención</h3>
    <div class="reloj-container mb-3">
      <div class="reloj-display" id="reloj-actual">--:--</div>
      <div class="reloj-fecha" id="fecha-actual">Cargando...</div>
    </div>
    <div class="status-badge" id="status-abierto">
      <span class="badge bg-success fs-6"><i class="bi bi-check-circle me-1"></i>Abierto</span>
    </div>
    <div class="horario-detalles mt-3 text-start">
      <div class="horario-item d-flex justify-content-between py-1 border-bottom border-secondary">
        <span class="text-light"><i class="bi bi-calendar-week me-2"></i>Lun - Vie</span>
        <span class="text-warning">8:00 AM - 6:00 PM</span>
      </div>
      <div class="horario-item d-flex justify-content-between py-1 border-bottom border-secondary">
        <span class="text-light"><i class="bi bi-calendar-event me-2"></i>Sábado</span>
        <span class="text-warning">8:00 AM - 4:00 PM</span>
      </div>
      <div class="horario-item d-flex justify-content-between py-1 border-bottom border-secondary">
        <span class="text-light"><i class="bi bi-calendar-x me-2"></i>Domingo</span>
        <span class="text-secondary">Cerrado</span>
      </div>
    </div>
    <div class="mt-2">
      <small class="text-muted">Hora de Cali, Colombia</small>
    </div>
  </div>
</div>
